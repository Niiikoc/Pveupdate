name: Release

# Every push to main whose VERSION has no release yet publishes one: tag
# vX.Y.Z, generated notes, and pveupdate.py plus the systemd units attached.
# Merges that don't change VERSION publish nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' pveupdate.py)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released, nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: python3 -m py_compile pveupdate.py
      - if: steps.version.outputs.new == 'true'
        name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes \
            pveupdate.py systemd/*.service systemd/*.timer
