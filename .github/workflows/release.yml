name: Release

# Publishing a release on GitHub (tag vX.Y.Z) attaches pveupdate.py and the
# systemd units. The install commands download from the latest release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' pveupdate.py)
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match VERSION $version in pveupdate.py"
            exit 1
          fi
      - run: python3 -m py_compile pveupdate.py
      - name: Attach files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" pveupdate.py systemd/*.service systemd/*.timer --clobber
