# Home Assistant package for pveupdate.
# Save as /config/packages/pveupdate.yaml and enable packages in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# Replace 192.168.1.10 with your Proxmox host. See the README for the SSH key setup.

command_line:
  - sensor:
      name: Proxmox updates
      unique_id: pveupdate_pending_guests
      command: >-
        ssh -i /config/.ssh/pveupdate -o StrictHostKeyChecking=accept-new
        -o UserKnownHostsFile=/config/.ssh/known_hosts root@192.168.1.10 status
      scan_interval: 300
      command_timeout: 30
      value_template: "{{ value_json.pending_guests }}"
      unit_of_measurement: guests
      json_attributes:
        - checked_at
        - running
        - pending_ids
        - guests

shell_command:
  pveupdate_check: >-
    ssh -i /config/.ssh/pveupdate -o StrictHostKeyChecking=accept-new
    -o UserKnownHostsFile=/config/.ssh/known_hosts root@192.168.1.10 check
  pveupdate_update: >-
    ssh -i /config/.ssh/pveupdate -o StrictHostKeyChecking=accept-new
    -o UserKnownHostsFile=/config/.ssh/known_hosts root@192.168.1.10 update {{ guests }}

script:
  pveupdate_check:
    alias: Proxmox - check for updates
    icon: mdi:magnify
    sequence:
      - action: shell_command.pveupdate_check

  pveupdate_update_pending:
    alias: Proxmox - update all guests with pending updates
    icon: mdi:update
    sequence:
      - action: shell_command.pveupdate_update
        data:
          guests: pending

  pveupdate_update_guest:
    alias: Proxmox - update guests
    icon: mdi:update
    fields:
      guests:
        name: Guest IDs
        description: Space-separated IDs, e.g. "101 105"
        example: "101 105"
        required: true
        selector:
          text:
    sequence:
      - action: shell_command.pveupdate_update
        data:
          guests: "{{ guests }}"

automation:
  - alias: Proxmox - notify when updates are available
    id: pveupdate_notify_pending
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.proxmox_updates
        above: 0
    actions:
      - action: notify.notify
        data:
          title: Proxmox updates available
          message: >-
            {% set g = state_attr('sensor.proxmox_updates', 'guests') %}
            {% for id, x in g.items() if x.pending -%}
            {{ x.name }} ({{ id }}): {{ x.packages }} packages
            {%- if x.app_update %}, {{ x.app }} {{ x.app_installed }} -> {{ x.app_latest }}{% endif %}
            {% endfor %}
