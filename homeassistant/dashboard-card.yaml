# Dashboard card: paste into a dashboard via "Add card" > "Manual".
type: vertical-stack
cards:
  - type: markdown
    title: Proxmox updates
    content: >-
      {% set s = 'sensor.proxmox_updates' %}
      {% set g = state_attr(s, 'guests') or {} %}
      {% if state_attr(s, 'running') %}**Update or check running...**{% endif %}

      | Guest | OS | App | Last update |
      |---|---|---|---|
      {% for id, x in g.items() -%}
      | {{ x.name }} ({{ id }}) | {{ x.packages ~ ' pkgs' if x.packages else ('✓' if x.state == 'ok' else x.state) }}{{ ' ⟳' if x.reboot_required }} | {{ (x.app_installed ~ (' → ' ~ x.app_latest if x.app_update else '')) if x.app_installed else '' }} | {{ (x.last_result ~ ' ' ~ as_timestamp(x.last_update) | timestamp_custom('%d/%m %H:%M')) if x.last_update else '' }} |
      {% endfor %}

      Last check: {{ as_timestamp(state_attr(s, 'checked_at')) | timestamp_custom('%d/%m %H:%M') if state_attr(s, 'checked_at') else 'never' }}
  - type: horizontal-stack
    cards:
      - type: button
        name: Check now
        icon: mdi:magnify
        tap_action:
          action: perform-action
          perform_action: script.pveupdate_check
      - type: button
        name: Update pending
        icon: mdi:update
        tap_action:
          action: perform-action
          perform_action: script.pveupdate_update_pending
          confirmation:
            text: Snapshot and update every guest with pending updates?
